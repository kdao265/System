name: Bug
description: Report unexpected application behavior
title: "[Bug] "
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Link the relevant requirement if available.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include starting state, steps and frequency.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, app version/commit and local/preview/production environment. Do not include secrets.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots / logs
      description: Remove credentials, tokens and personal information before attaching.
