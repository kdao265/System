name: Playwright E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_CONTEXT: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and system libraries
        run: npx --no-install playwright install --with-deps chromium
      - name: Pull required disposable service images (bounded retry)
        shell: bash
        run: |
          set -euo pipefail
          images=(
            public.ecr.aws/supabase/postgres:17.6.1.166
            public.ecr.aws/supabase/gotrue:v2.197.0
            public.ecr.aws/supabase/postgrest:v16.2
          )
          for image in "${images[@]}"; do
            pulled=false
            for attempt in 1 2 3 4; do
              if docker pull "$image"; then
                docker image inspect "$image" >/dev/null
                pulled=true
                break
              fi
              if [ "$attempt" -lt 4 ]; then
                delay=$((20 * attempt))
                echo "::warning::Registry pull failed for ${image}; retrying in ${delay}s (${attempt}/4)"
                sleep "$delay"
              fi
            done
            if [ "$pulled" != true ]; then
              echo "::error::Required disposable image ${image} unavailable after 4 attempts"
              exit 1
            fi
          done
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx --no-install tsc --noEmit
      - name: Node regressions including E2E safety guards
        run: node --test tests/*.test.mjs
      - name: Existing disposable database and migration regressions
        run: node supabase/tests/private-owner-wire.mjs
      - name: Existing disposable auth regression and production build
        run: node tests/auth-smoke.mjs
      - name: Discover browser coverage
        run: npm run test:e2e -- --list
      - name: Run isolated desktop and mobile browser tests
        run: npm run test:e2e
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
