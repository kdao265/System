name: Playwright E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_CONTEXT: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and system libraries
        run: npx --no-install playwright install --with-deps chromium
      - name: Cache required disposable service images
        shell: bash
        run: |
          set -euo pipefail
          pull_image() {
            local image="$1" attempt=1 delay=15 output
            while true; do
              if output="$(docker pull "$image" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi
              if ! grep -Eiq 'toomanyrequests|rate exceeded|too many requests|(^|[[:space:]])429([[:space:]]|$)' <<< "$output"; then
                printf '%s\n' "$output" >&2
                return 1
              fi
              if (( attempt >= 4 )); then
                echo "::error::Docker rate limit persisted after 4 attempts for $image"
                printf '%s\n' "$output" >&2
                return 1
              fi
              echo "::warning::Docker rate limited $image (attempt $attempt/4); retrying in $delay seconds"
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }
          pull_image public.ecr.aws/supabase/postgres:17.6.1.166
          sleep 5
          pull_image public.ecr.aws/supabase/gotrue:v2.197.0
          sleep 5
          pull_image public.ecr.aws/supabase/postgrest:v16.2
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx --no-install tsc --noEmit
      - name: Node regressions including E2E safety guards
        run: node --test tests/*.test.mjs
      - name: Existing disposable database and migration regressions
        run: node supabase/tests/private-owner-wire.mjs
      - name: Existing disposable auth regression and production build
        run: node tests/auth-smoke.mjs
      - name: Discover browser coverage
        run: npm run test:e2e -- --list
      - name: Run isolated desktop and mobile browser tests
        run: npm run test:e2e
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
