name: Quest Creation CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-supabase-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_CI_PROJECT_ID: system-reopen-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SUPABASE_DB_CONTAINER: supabase_db_system-reopen-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SUPABASE_CI_DISPOSABLE: quest-reopen-v2
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_CONTEXT: ''

    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Start fresh Supabase Local at migration eight
        run: |
          set -Eeuo pipefail

          # Every run gets its own disposable project; never reuse System data.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          if docker container inspect "$SUPABASE_DB_CONTAINER" >/dev/null 2>&1 \
            || docker volume inspect "$SUPABASE_DB_CONTAINER" >/dev/null 2>&1; then
            echo 'Refusing to reuse an existing CI database container or volume'
            exit 1
          fi
          grep -qx 'project_id = "System"' supabase/config.toml
          sed -i "s/^project_id = \"System\"$/project_id = \"$SUPABASE_CI_PROJECT_ID\"/" supabase/config.toml

          if [[ ! -f supabase/seed.sql ]]; then
            : > supabase/seed.sql
          fi

          # `start` applies every available migration: hold back everything newer than
          # migration eight (Reopen V2, Completion Aliases, the private owner install and
          # any migration added later) until its own stage. The EXIT trap restores every
          # held file on success and on failure, so the checked-in set is never incomplete.
          v2=supabase/migrations/20260926000000_quest_reopen_v2.sql
          alias_migration=supabase/migrations/20260926120000_quest_completion_aliases.sql
          private_owner=supabase/migrations/20260928090000_install_private_owner.sql
          held_dir="$RUNNER_TEMP/held-migrations"
          mkdir -p "$held_dir"
          test -z "$(ls -A "$held_dir")"

          hold_migrations_after() {
            local cutoff="$1"
            local file version
            for file in supabase/migrations/*.sql; do
              version="$(basename "$file" .sql)"
              version="${version%%_*}"
              if [[ "$version" > "$cutoff" ]]; then
                mv "$file" "$held_dir/"
              fi
            done
          }

          restore_migrations() {
            local file
            for file in "$held_dir"/*.sql; do
              [[ -e "$file" ]] || continue
              mv "$file" supabase/migrations/
            done
          }

          hold_migrations_after 20260923120000
          # All three known migrations past migration eight must be moved out first.
          test -e "$held_dir/20260926000000_quest_reopen_v2.sql"
          test -e "$held_dir/20260926120000_quest_completion_aliases.sql"
          test -e "$held_dir/20260928090000_install_private_owner.sql"
          trap restore_migrations EXIT
          npx --no-install supabase start
          npx --no-install supabase db reset --local --version 20260923120000 --no-seed --yes
          container_id="$(docker inspect --type container --format '{{.Id}}' "$SUPABASE_DB_CONTAINER")"
          [[ "$container_id" =~ ^[a-f0-9]{64}$ ]]
          echo "SUPABASE_CI_CONTAINER_ID=$container_id" >> "$GITHUB_ENV"

          restore_migrations
          trap - EXIT
          test -f "$v2"
          test -f "$alias_migration"
          test -f "$private_owner"
          echo 'Restored migration files: quest_reopen_v2, quest_completion_aliases and install_private_owner'

      - name: Verify Stage A has exactly eight migrations
        run: |
          set -Eeuo pipefail
          expected='20260918034836,20260918083114,20260919063117,20260920050000,20260921090000,20260922000000,20260923000000,20260923120000'
          actual="$(docker exec "$SUPABASE_DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -Atc \
            "SELECT string_agg(version::text, ',' ORDER BY version) FROM supabase_migrations.schema_migrations;")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Migration history mismatch. Expected: $expected"
            echo "Migration history found: $actual"
            exit 1
          fi
          echo "Verified migrations: $actual"

      - name: Run level rewards catalog first
        run: |
          set -Eeuo pipefail
          docker exec -i "$SUPABASE_DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/level-rewards-catalog.sql

      - name: Run Stage A historical SQL test suites
        run: |
          set -Eeuo pipefail
          suites=(
            request-identity.sql
            request-identity-compat.sql
            request-identity-compat-catalog.sql
            profiles.sql
            player-exp-catalog.sql
            player-exp.sql
            level-rewards.sql
            quest-commands-catalog.sql
            quest-commands.sql
            day-quest-reads-catalog.sql
            day-quest-reads.sql
            quest-creation-catalog.sql
            quest-creation.sql
          )
          for suite in "${suites[@]}"; do
            echo "::group::Running supabase/tests/$suite"
            docker exec -i "$SUPABASE_DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              < "supabase/tests/$suite"
            echo "PASS: supabase/tests/$suite"
            echo "::endgroup::"
          done

      - name: Run Stage A Player/EXP preflight supplemental test
        run: node supabase/tests/player-exp-preflight.mjs

      - name: Apply Reopen V2 migration for Stage B
        run: |
          set -Eeuo pipefail

          # Stage B applies Reopen V2 only: hold back Completion Aliases, the private
          # owner install and any migration added after 20260926000000. The EXIT trap
          # restores every held file if the push fails.
          alias_migration=supabase/migrations/20260926120000_quest_completion_aliases.sql
          private_owner=supabase/migrations/20260928090000_install_private_owner.sql
          held_dir="$RUNNER_TEMP/held-migrations"
          mkdir -p "$held_dir"
          test -z "$(ls -A "$held_dir")"

          hold_migrations_after() {
            local cutoff="$1"
            local file version
            for file in supabase/migrations/*.sql; do
              version="$(basename "$file" .sql)"
              version="${version%%_*}"
              if [[ "$version" > "$cutoff" ]]; then
                mv "$file" "$held_dir/"
              fi
            done
          }

          restore_migrations() {
            local file
            for file in "$held_dir"/*.sql; do
              [[ -e "$file" ]] || continue
              mv "$file" supabase/migrations/
            done
          }

          hold_migrations_after 20260926000000
          # Completion Aliases and the private owner install must both stay out.
          test -e "$held_dir/20260926120000_quest_completion_aliases.sql"
          test -e "$held_dir/20260928090000_install_private_owner.sql"
          trap restore_migrations EXIT

          npx --no-install supabase db push --local --yes
          restore_migrations
          trap - EXIT
          test -f "$alias_migration"
          test -f "$private_owner"
          echo 'Restored migration files: quest_completion_aliases and install_private_owner'

      - name: Verify Stage B has exactly nine migrations
        run: |
          set -Eeuo pipefail
          expected='20260918034836,20260918083114,20260919063117,20260920050000,20260921090000,20260922000000,20260923000000,20260923120000,20260926000000'
          actual="$(docker exec "$SUPABASE_DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -Atc \
            "SELECT string_agg(version::text, ',' ORDER BY version) FROM supabase_migrations.schema_migrations;")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Migration history mismatch. Expected: $expected"
            echo "Migration history found: $actual"
            exit 1
          fi
          echo "Verified Stage B migrations: $actual"

      - name: Run Reopen V2 catalog and behavior suites
        run: |
          set -Eeuo pipefail
          for suite in quest-reopen-v2-catalog.sql quest-reopen-v2.sql; do
            echo "::group::Running supabase/tests/$suite"
            docker exec -i "$SUPABASE_DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              < "supabase/tests/$suite"
            echo "PASS: supabase/tests/$suite"
            echo "::endgroup::"
          done

      - name: Run Stage B compatible regression suites
        run: |
          set -Eeuo pipefail
          suites=(
            request-identity.sql
            request-identity-compat.sql
            request-identity-compat-catalog.sql
            profiles.sql
            player-exp-catalog.sql
            player-exp.sql
            level-rewards.sql
            quest-creation-catalog.sql
            quest-creation.sql
          )
          for suite in "${suites[@]}"; do
            echo "::group::Running compatible supabase/tests/$suite"
            docker exec -i "$SUPABASE_DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              < "supabase/tests/$suite"
            echo "PASS: supabase/tests/$suite"
            echo "::endgroup::"
          done

      - name: Record pre-migration Completion Alias fixture at nine
        run: |
          set -Eeuo pipefail

          # Committed migration-nine fixtures consumed after migration ten is applied.
          # The alias table must not exist yet, or the upgrade proof is meaningless.
          absent="$(docker exec "$SUPABASE_DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -Atc \
            "SELECT (to_regclass('system_internal.quest_completion_aliases') IS NULL)::text;")"
          if [[ "$absent" != 'true' ]]; then
            echo 'Completion Alias table already exists before migration ten'
            exit 1
          fi
          docker exec -i "$SUPABASE_DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/quest-completion-alias-upgrade-before.sql
          echo 'PASS: pre-migration fixture recorded at nine with no alias table'

      - name: Apply Completion Alias migration for Stage C
        run: |
          set -Eeuo pipefail

          # Stage C applies Completion Aliases only: hold back the private owner install
          # and any migration added after 20260926120000. The EXIT trap restores the file
          # if the push fails.
          private_owner=supabase/migrations/20260928090000_install_private_owner.sql
          held_dir="$RUNNER_TEMP/held-migrations"
          mkdir -p "$held_dir"
          test -z "$(ls -A "$held_dir")"

          hold_migrations_after() {
            local cutoff="$1"
            local file version
            for file in supabase/migrations/*.sql; do
              version="$(basename "$file" .sql)"
              version="${version%%_*}"
              if [[ "$version" > "$cutoff" ]]; then
                mv "$file" "$held_dir/"
              fi
            done
          }

          restore_migrations() {
            local file
            for file in "$held_dir"/*.sql; do
              [[ -e "$file" ]] || continue
              mv "$file" supabase/migrations/
            done
          }

          hold_migrations_after 20260926120000
          test -e "$held_dir/20260928090000_install_private_owner.sql"
          trap restore_migrations EXIT

          npx --no-install supabase db push --local --yes
          restore_migrations
          trap - EXIT
          test -f "$private_owner"
          echo 'Restored migration file: install_private_owner'

      - name: Verify Stage C has exactly ten migrations
        run: |
          set -Eeuo pipefail
          expected='20260918034836,20260918083114,20260919063117,20260920050000,20260921090000,20260922000000,20260923000000,20260923120000,20260926000000,20260926120000'
          actual="$(docker exec "$SUPABASE_DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -Atc \
            "SELECT string_agg(version::text, ',' ORDER BY version) FROM supabase_migrations.schema_migrations;")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Migration history mismatch. Expected: $expected"
            echo "Migration history found: $actual"
            exit 1
          fi
          echo "Verified Stage C migrations: $actual"

      - name: Run Completion Alias upgrade, security and behavior suites
        run: |
          set -Eeuo pipefail
          suites=(
            quest-completion-alias-upgrade-after.sql
            quest-completion-alias-catalog.sql
            quest-completion-alias.sql
          )
          for suite in "${suites[@]}"; do
            echo "::group::Running supabase/tests/$suite"
            docker exec -i "$SUPABASE_DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              < "supabase/tests/$suite"
            echo "PASS: supabase/tests/$suite"
            echo "::endgroup::"
          done

      - name: Run Stage C compatible regression suites
        run: |
          set -Eeuo pipefail

          # Re-created commands must keep their contracts. level-rewards-catalog.sql stays
          # in Stage A because its final assertion requires a pristine runtime state.
          suites=(
            quest-reopen-v2-catalog.sql
            quest-reopen-v2.sql
            request-identity.sql
            request-identity-compat.sql
            request-identity-compat-catalog.sql
            profiles.sql
            player-exp-catalog.sql
            player-exp.sql
            level-rewards.sql
            quest-creation-catalog.sql
            quest-creation.sql
          )
          for suite in "${suites[@]}"; do
            echo "::group::Running compatible supabase/tests/$suite"
            docker exec -i "$SUPABASE_DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              < "supabase/tests/$suite"
            echo "PASS: supabase/tests/$suite"
            echo "::endgroup::"
          done

      - name: Run Reopen V2 two-session concurrency regression
        run: node supabase/tests/quest-reopen-v2-concurrency.mjs

      - name: Run Completion Alias two-session concurrency regression
        run: node supabase/tests/quest-completion-alias-concurrency.mjs

      - name: Publish test summary
        if: success()
        run: |
          {
            echo '## Fresh Supabase CI summary'
            echo
            echo '- Fresh local Supabase instance: started and reset through migration eight'
            echo '- Stage A: historical V1 suites ran before the V2 permission change'
            echo '- Stage B: Reopen V2 migration applied and nine versions verified'
            echo '- Stage B: V2 suites, compatible regression suites and the pre-migration Completion Alias fixture ran'
            echo '- Stage C: Completion Alias migration applied and ten versions verified'
            echo '- Stage C: legacy upgrade proof, alias security/catalog, alias behavior and compatible regressions ran'
            echo '- Supplemental checks: player-exp-preflight.mjs, Reopen V2 and Completion Alias two-session concurrency'
            echo '- Database target: verified run-scoped disposable Docker container; Unix socket only'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop Supabase Local
        if: always()
        run: |
          set -Eeuo pipefail
          # Do not target the checked-in developer project if setup failed early.
          if grep -qx "project_id = \"$SUPABASE_CI_PROJECT_ID\"" supabase/config.toml; then
            npx --no-install supabase stop --no-backup
          fi
